<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="description" content="MORE BEAUTY 美护智能推荐官，输入品牌，回答几个简短问题，获得一份专属于你的品牌适配报告。">
  <title>MORE BEAUTY · 美护智能推荐官</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <span class="wordmark">MORE BEAUTY</span>
      <span class="header-note">PERSONAL BEAUTY ADVISORY</span>
    </header>
    <main class="hero">
      <div class="hero__main">
        <p class="eyebrow"><span class="eyebrow__line"></span>BEAUTY, CONSIDERED</p>
        <h1 class="hero__title">从一个品牌开始，找到更适合你的那一款</h1>
        <p class="hero__intro">输入品牌，回答几个问题，生成专属适配报告。</p>
        <form class="brand-form" id="brand-form" novalidate>
          <div class="brand-field">
            <label class="visually-hidden" for="brand-input">品牌名称</label>
            <input
              class="brand-input"
              id="brand-input"
              name="brand"
              type="text"
              placeholder="输入品牌，例如兰蔻"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="search"
              maxlength="40"
              aria-describedby="brand-message"
            >
            <button class="brand-submit" type="submit" aria-label="开始适配">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="hot-brands">
            <span class="hot-brands__label">热门品牌</span>
            <div class="hot-brands__list" id="hot-brands"></div>
          </div>
          <p class="brand-message" id="brand-message" role="status" aria-live="polite"></p>
        </form>
      </div>
      <aside class="hero__side" aria-hidden="true">
        <span class="hero__side-line"></span>
        <p>23 BRANDS<br>3 QUESTIONS<br>1 REPORT</p>
      </aside>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay__veil" id="overlay-veil"></div>
    <section
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="question-title"
      tabindex="-1"
    >
      <div class="sheet__bar">
        <button class="bar-button" id="back-button" type="button" aria-label="返回上一步" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M19 12H6M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="sheet__eyebrow" id="sheet-eyebrow"></p>
        <button class="bar-button" id="close-button" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sheet__body">
        <div class="question-view" id="question-view">
          <div class="question-progress" id="question-progress" hidden aria-hidden="true"></div>
          <h2 class="question-title" id="question-title" tabindex="-1"></h2>
          <p class="question-hint" id="question-hint"></p>
          <div class="answer-options" id="answer-options" role="group" aria-labelledby="question-title"></div>
        </div>
        <div class="report-view" id="report-view" hidden></div>
      </div>
    </section>
  </div>

  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
